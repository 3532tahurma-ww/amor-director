<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // Telefonda arayüz %85 ölçekte (Amor Stories'teki gibi)
    (function () {
      var UI_SCALE = 0.85, sw = Math.min(screen.width, screen.height);
      if (sw >= 600) return;
      var w = Math.round(sw / UI_SCALE), s = (sw / w).toFixed(4);
      document.querySelector('meta[name=viewport]').setAttribute('content',
        'width=' + w + ', initial-scale=' + s + ', minimum-scale=' + s + ', maximum-scale=' + s + ', user-scalable=no, viewport-fit=cover');
    })();
  </script>
  <meta name="theme-color" content="#7b5cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Amor Director - basit figürlerle sahne tasarla ve canlandır.">
  <title>Amor Director</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Amor Director">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

  </div>

  <script src="js/store.js"></script>
  <script src="js/figure.js"></script>
  <script src="js/places.js"></script>
  <script src="js/texts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
